name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish
        run: dotnet publish src/LiDPI -c Release -o out

      - name: Compute SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash out/LiDPI.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  LiDPI.exe" | Out-File -FilePath out/LiDPI.exe.sha256.txt -Encoding ascii -NoNewline
          Write-Host "SHA256: $hash"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LiDPI ${{ github.ref_name }}
          body: |
            Windows için tek tıkla açılıp kapanan bir DPI engeli aşma aracı.

            **Nasıl kurulur?** `LiDPI.exe` dosyasını indirip çalıştırmanız yeterli. Kurulum ya da .NET gerekmez. Program yönetici izni ister, çünkü "Tüm Uygulamalar" modu bir sürücü yükler.
            **Dosyayı doğrulamak için** `LiDPI.exe.sha256.txt` içindeki SHA256 değerine bakabilirsiniz.
            **Uyarı mı aldınız?** Windows SmartScreen ya da antivirüsünüz uyarı verirse README'deki "Sık sorulan sorular" bölümüne göz atın.

            ---

            A one-button DPI bypass tool for Windows.

            **Install:** download `LiDPI.exe` and run it. No installer, no .NET needed. It asks for admin rights because "All apps" mode loads a driver.
            **Verify:** compare the file with the SHA256 in `LiDPI.exe.sha256.txt`.
            **Got a warning?** If SmartScreen or your antivirus complains, see the FAQ in the README.
          files: |
            out/LiDPI.exe
            out/LiDPI.exe.sha256.txt
